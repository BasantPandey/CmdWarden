# #94: Dependabot opens one PR each week per ecosystem for new versions of packages and actions.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # 7.7.0 targets net11.0 only. This repo stays on net10.0.
      - dependency-name: System.Management.Automation
        versions: [">= 7.7.0"]

  # #97: the docs build packages in requirements-docs.txt.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      docs:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
