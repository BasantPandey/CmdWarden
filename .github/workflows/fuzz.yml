# #97: a long fuzz run of the parsers that read agent data, with new inputs each week.
name: fuzz

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build tests/CmdWarden.Tests/CmdWarden.Tests.csproj -c Release

      # A failure names the seed and the input, so the same run repeats on a PC.
      - name: Fuzz
        env:
          CW_FUZZ_ITERATIONS: '300000'
          CW_FUZZ_SEED: ${{ github.run_number }}
        run: dotnet test tests/CmdWarden.Tests/CmdWarden.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~CmdWarden.Tests.FuzzTests"
