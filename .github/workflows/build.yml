# Build and test on main/PR. Build the portable folder (#64), test that it runs with no .NET, and
# upload it as a workflow artifact.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CmdWarden.sln

      # #94: fail on a package with a known vulnerability, direct or transitive.
      - name: Check for vulnerable packages
        shell: pwsh
        run: |
          $out = dotnet list CmdWarden.sln package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "dotnet list package failed." }
          if ($out -match 'has the following vulnerable packages') { throw "A package has a known vulnerability. Update it." }

      - name: Build
        run: dotnet build CmdWarden.sln -c Release --no-restore

      - name: Test
        run: dotnet test CmdWarden.sln -c Release --no-build --filter "Category!=Process"

      - name: Build the portable folder
        shell: pwsh
        run: ./scripts/Build-Portable.ps1 -Out artifacts/bin

      - name: Smoke test with no .NET on PATH
        shell: pwsh
        run: ./scripts/Test-Portable.ps1 -Folder artifacts/bin

      # install.cmd starts the installer with Windows PowerShell 5.1, not pwsh.
      - name: Install from the setup layout with Windows PowerShell 5.1
        shell: pwsh
        run: |
          $setup = "artifacts/setup"
          New-Item -ItemType Directory -Force $setup | Out-Null
          Copy-Item -Recurse artifacts/bin "$setup/app"
          foreach ($f in "install.cmd", "uninstall.cmd", "Install-CmdWarden.ps1", "Uninstall-CmdWarden.ps1") { Copy-Item "scripts/$f" $setup }
          $dir = Join-Path $env:RUNNER_TEMP "cw-app"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$setup/Install-CmdWarden.ps1" -Yes -InstallDir $dir
          if ($LASTEXITCODE -ne 0) { throw "The installer failed with exit code $LASTEXITCODE." }
          & "$dir/cw.exe" version
          if ($LASTEXITCODE -ne 0) { throw "The installed cw.exe did not run." }

      - name: Upload bin artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cmdwarden-win-x64
          path: artifacts/bin/**
          if-no-files-found: error
          retention-days: 14

  # #97: the gate, proxy, ssh, and audit tests start a real Session Agent and real tools.
  process-tests:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build CmdWarden.sln -c Release

      - name: Process tests
        run: dotnet test CmdWarden.sln -c Release --no-build --filter "Category=Process" --blame-hang-timeout 5m --logger "console;verbosity=normal"
