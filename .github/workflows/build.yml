# Build + test on main/PR; upload Windows exe layout as a workflow artifact.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CmdWarden.sln

      - name: Build
        run: dotnet build CmdWarden.sln -c Release --no-restore

      - name: Unit tests
        run: dotnet test CmdWarden.sln -c Release --no-build --verbosity normal --filter "Category!=Process"

      # Process tests spawn the Session Agent and run serial. Main and dispatch only.
      - name: Process tests
        if: github.event_name != 'pull_request'
        run: dotnet test CmdWarden.sln -c Release --no-build --verbosity normal --filter "Category=Process"

      - name: Publish Windows exes
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "artifacts/bin"
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          New-Item -ItemType Directory -Path $out | Out-Null

          # Framework-dependent publish (no RID) so agent/shim copy targets work.
          dotnet publish src/CmdWarden.Cli/CmdWarden.Cli.csproj `
            -c Release `
            -o $out `
            -p:PublishSingleFile=false

          $required = @(
            "cw.exe",
            "cmdwarden.exe",
            "agent\CmdWarden.Agent.exe",
            "shim-payload\gh.exe",
            "shim-payload\git.exe",
            "shim-payload\az.exe",
            "shim-payload\docker.exe",
            "shim-payload\docker-credential-cmdwarden.exe"
          )
          foreach ($rel in $required) {
            $p = Join-Path $out $rel
            if (-not (Test-Path $p)) {
              Write-Host "Publish tree:"
              Get-ChildItem $out -Recurse -File | Select-Object -ExpandProperty FullName
              throw "Missing expected binary after publish: $rel"
            }
          }

      - name: Upload bin artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: cmdwarden-win-x64
          path: artifacts/bin/**
          if-no-files-found: error
          retention-days: 14
