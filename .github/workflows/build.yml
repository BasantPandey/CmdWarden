# Build and test on main/PR. Build the portable folder (#64), test that it runs with no .NET, and
# upload it as a workflow artifact.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CmdWarden.sln

      - name: Build
        run: dotnet build CmdWarden.sln -c Release --no-restore

      - name: Test
        run: dotnet test CmdWarden.sln -c Release --no-build --filter "Category!=Process"

      - name: Build the portable folder
        shell: pwsh
        run: ./scripts/Build-Portable.ps1 -Out artifacts/bin

      - name: Smoke test with no .NET on PATH
        shell: pwsh
        run: ./scripts/Test-Portable.ps1 -Folder artifacts/bin

      - name: Upload bin artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: cmdwarden-win-x64
          path: artifacts/bin/**
          if-no-files-found: error
          retention-days: 14
