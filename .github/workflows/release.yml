# Tag-triggered release. Push v0.8.0 and the workflow builds, signs when a signing way is set,
# tests, and publishes:
#   CmdWarden.0.8.0-win-x64.zip   portable folder with its own .NET runtime (winget and Scoop use it)
#   CmdWarden.0.8.0-setup.zip     the same folder in app\, plus install.cmd and uninstall.cmd
#   CmdWarden.0.8.0.nupkg         dotnet tool for .NET developers (also to NuGet.org when NUGET_API_KEY is set)
#   CmdWarden.0.8.0-packages.zip  winget and Scoop manifests with the real sha256
#   CmdWarden.0.8.0.cdx.json      the SBOM (CycloneDX): every package in the portable folder
#   CmdWarden.0.8.0.intoto.jsonl  the build provenance bundle of all these files
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  pack-release:
    runs-on: windows-latest
    permissions:
      contents: write
      packages: write
      actions: read
      # #94: build provenance for the release files.
      id-token: write
      attestations: write
    # #42, #64: signing runs when one signing way is set. Secrets cannot go in an if, so env carries them.
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
      CODE_SIGNING_PFX: ${{ secrets.CODE_SIGNING_PFX }}
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Derive package version from tag
        id: ver
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v.+') { throw "Tag must match v*: $tag" }
          $version = $tag.Substring(1)
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Empty version after stripping v" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Package version: $version (tag $tag)"

      - name: Restore
        run: dotnet restore CmdWarden.sln

      - name: Build
        run: >
          dotnet build CmdWarden.sln
          -c Release
          --no-restore
          -p:Version=${{ env.VERSION }}
          -p:PackageVersion=${{ env.VERSION }}

      - name: Test
        run: dotnet test CmdWarden.sln -c Release --no-build --verbosity normal --filter "Category!=Process"

      - name: Pack tool (nupkg)
        # Pack rebuilds/publishes for PackAsTool so agent/ + shim-payload/ inject correctly.
        run: >
          dotnet pack src/CmdWarden.Cli/CmdWarden.Cli.csproj
          -c Release
          -o ${{ github.workspace }}/artifacts/nupkg
          -p:Version=${{ env.VERSION }}
          -p:PackageVersion=${{ env.VERSION }}

      - name: Build the portable folder
        shell: pwsh
        run: ./scripts/Build-Portable.ps1 -Version $env:VERSION -Out artifacts/bin

      - name: Stage the files to sign
        shell: pwsh
        run: >
          ./scripts/Release-Signing.ps1 -Stage
          -Bin artifacts/bin
          -Nupkg artifacts/nupkg/CmdWarden.${{ env.VERSION }}.nupkg
          -Script scripts/Install-CmdWarden.ps1,scripts/Uninstall-CmdWarden.ps1
          -Out artifacts/to-sign

      # #64: SignPath Foundation signs open-source projects for free.
      - name: Upload the files to sign
        id: unsigned
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: to-sign
          path: artifacts/to-sign/files/**
          if-no-files-found: error

      - name: Sign with SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: artifacts/to-sign/files

      - name: Sign with Azure Artifact Signing
        if: env.SIGNPATH_API_TOKEN == '' && env.ARTIFACT_SIGNING_ENDPOINT != ''
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}/artifacts/to-sign/files
          files-folder-filter: exe,dll,ps1
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign with a code signing certificate
        if: env.SIGNPATH_API_TOKEN == '' && env.ARTIFACT_SIGNING_ENDPOINT == '' && env.CODE_SIGNING_PFX != ''
        shell: pwsh
        env:
          CODE_SIGNING_PASSWORD: ${{ secrets.CODE_SIGNING_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cmdwarden-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODE_SIGNING_PFX))
          try {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName | Select-Object -Last 1 -ExpandProperty FullName
            $files = Get-ChildItem artifacts/to-sign/files -Recurse -File | Select-Object -ExpandProperty FullName
            & $signtool sign /fd SHA256 /f $pfx /p $env:CODE_SIGNING_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $files
            if ($LASTEXITCODE -ne 0) { throw "signtool failed with exit code $LASTEXITCODE" }
          }
          finally {
            Remove-Item -Force $pfx -ErrorAction SilentlyContinue
          }

      - name: Put the signed files back and check them
        id: signed
        shell: pwsh
        run: |
          if (-not $env:SIGNPATH_API_TOKEN -and -not $env:ARTIFACT_SIGNING_ENDPOINT -and -not $env:CODE_SIGNING_PFX) {
            if ("${{ vars.REQUIRE_SIGNING }}" -eq "true") { throw "REQUIRE_SIGNING is true, but no signing secret is set." }
            Write-Host "::warning::No signing secret is set. The release binaries are not signed."
            "SIGNED=false" | Out-File -FilePath $env:GITHUB_ENV -Append
            exit 0
          }
          ./scripts/Release-Signing.ps1 -Apply -Out artifacts/to-sign
          ./scripts/Release-Signing.ps1 -Verify -Out artifacts/to-sign
          "SIGNED=true" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Smoke test with no .NET on PATH
        shell: pwsh
        run: |
          $signed = @{}
          if ($env:SIGNED -eq "true") { $signed.RequireSigned = $true }
          ./scripts/Test-Portable.ps1 -Folder artifacts/bin @signed

      - name: Push nupkg to GitHub Packages
        run: >
          dotnet nuget push ${{ github.workspace }}/artifacts/nupkg/CmdWarden.${{ env.VERSION }}.nupkg
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate

      - name: Push nupkg to NuGet.org
        if: env.NUGET_API_KEY != ''
        run: >
          dotnet nuget push ${{ github.workspace }}/artifacts/nupkg/CmdWarden.${{ env.VERSION }}.nupkg
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ secrets.NUGET_API_KEY }}
          --skip-duplicate

      - name: Zip the portable folder, the setup, and the manifests
        shell: pwsh
        run: |
          $v = $env:VERSION
          $art = Join-Path $env:GITHUB_WORKSPACE "artifacts"
          $zip = Join-Path $art "CmdWarden.$v-win-x64.zip"
          Compress-Archive -Path (Join-Path $art "bin/*") -DestinationPath $zip -Force

          $setup = Join-Path $art "setup"
          New-Item -ItemType Directory -Force $setup | Out-Null
          Copy-Item -Recurse (Join-Path $art "bin") (Join-Path $setup "app")
          foreach ($f in "install.cmd", "uninstall.cmd", "Install-CmdWarden.ps1", "Uninstall-CmdWarden.ps1") {
            Copy-Item (Join-Path $env:GITHUB_WORKSPACE "scripts/$f") $setup
          }
          Compress-Archive -Path (Join-Path $setup "*") -DestinationPath (Join-Path $art "CmdWarden.$v-setup.zip") -Force

          ./scripts/New-PackageManifests.ps1 -Version $v -Zip $zip -Out (Join-Path $art "packages")
          Compress-Archive -Path (Join-Path $art "packages/*") -DestinationPath (Join-Path $art "CmdWarden.$v-packages.zip") -Force
          Get-ChildItem $art -Filter "CmdWarden.$v*" | Format-Table Name, Length

      # #97: the SBOM lists each package that the .deps.json files of the portable folder name.
      - name: Make the SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        env:
          SYFT_SOURCE_NAME: CmdWarden
          SYFT_SOURCE_VERSION: ${{ env.VERSION }}
        with:
          path: artifacts/bin
          format: cyclonedx-json
          output-file: artifacts/CmdWarden.${{ env.VERSION }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      # #94: users check a file with: gh attestation verify <file> --repo BasantPandey/CmdWarden
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/CmdWarden.${{ env.VERSION }}-win-x64.zip
            artifacts/CmdWarden.${{ env.VERSION }}-setup.zip
            artifacts/CmdWarden.${{ env.VERSION }}-packages.zip
            artifacts/CmdWarden.${{ env.VERSION }}.cdx.json
            artifacts/nupkg/CmdWarden.${{ env.VERSION }}.nupkg

      # #97: OpenSSF Scorecard finds signed provenance by the .intoto.jsonl name on the release.
      - name: Keep the provenance bundle
        shell: pwsh
        run: Copy-Item "${{ steps.attest.outputs.bundle-path }}" "artifacts/CmdWarden.$env:VERSION.intoto.jsonl"

      - name: Create GitHub Release and attach assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $v = $env:VERSION
          $art = Join-Path $env:GITHUB_WORKSPACE "artifacts"
          $assets = @(
            (Join-Path $art "CmdWarden.$v-win-x64.zip"),
            (Join-Path $art "CmdWarden.$v-setup.zip"),
            (Join-Path $art "nupkg/CmdWarden.$v.nupkg"),
            (Join-Path $art "CmdWarden.$v-packages.zip"),
            (Join-Path $art "CmdWarden.$v.cdx.json"),
            (Join-Path $art "CmdWarden.$v.intoto.jsonl")
          )
          foreach ($a in $assets) { if (-not (Test-Path $a)) { throw "Missing asset: $a" } }
          $signature = if ($env:SIGNED -eq "true") { 'Every CmdWarden exe and dll is signed. Check them:' }
            else { 'This release is not signed yet: Windows SmartScreen may warn. Compare the sha256 of the zip with this page. A signed release shows `Valid` here:' }
          $dotnetTool = if ($env:NUGET_API_KEY) { '`dotnet tool install -g CmdWarden`' }
            else { "Download ``CmdWarden.$v.nupkg`` to a folder, then ``dotnet tool install -g CmdWarden --add-source <folder>``" }

          $notes = @"
          ## CmdWarden $v

          Make AI coding agents ask before they use your CLI secrets on Windows.

          ### Install

          | Way | Command or file |
          |-----|-----------------|
          | winget | ``winget install BasantPandey.CmdWarden`` (when the winget catalog has this version) |
          | Setup zip | Download ``CmdWarden.$v-setup.zip``, extract it, double-click ``install.cmd`` |
          | Portable zip | Extract ``CmdWarden.$v-win-x64.zip`` and run ``cw.exe`` |
          | dotnet tool | $dotnetTool (needs the .NET 10 SDK) |

          The winget package, the setup zip, and the portable zip carry their own .NET runtime. No .NET install and no admin prompt.

          Then run ``cw setup``. It sets up everything and shows a real Approval Gate card.

          ### Signature

          $signature

          ``````powershell
          Get-ChildItem "`$env:LOCALAPPDATA\CmdWarden\app" -Recurse -Include cw.exe, CmdWarden.*.exe |
            Get-AuthenticodeSignature | Format-Table Status, Path
          ``````

          ### Where it came from

          GitHub signs a build provenance record for each file of this release. Check that a file came from this repo and its release workflow:

          ``````powershell
          gh attestation verify CmdWarden.$v-setup.zip --repo BasantPandey/CmdWarden
          ``````

          ``CmdWarden.$v.intoto.jsonl`` holds the same records, for a check with no network: add ``--bundle CmdWarden.$v.intoto.jsonl``.
          ``CmdWarden.$v.cdx.json`` is the SBOM in CycloneDX format. It lists each package in the portable zip.

          ### Update and remove

          ``cw update`` installs the newest release after a sha256 check. A winget install updates with ``winget upgrade BasantPandey.CmdWarden``.
          ``cw uninstall`` removes CmdWarden and every change it made.

          ### Code signing policy

          Read the [Code signing policy](https://basantpandey.github.io/CmdWarden/code-signing-policy/): who signs CmdWarden, and how.
          "@
          $notes = ($notes -split "`n" | ForEach-Object { $_ -replace '^          ', '' }) -join "`n"
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          Set-Content -Path $notesPath -Value $notes.Trim() -Encoding utf8

          gh release create $env:TAG @assets `
            --title "CmdWarden $v" `
            --notes-file $notesPath `
            --verify-tag

      - name: Submit to the winget catalog
        if: env.WINGET_TOKEN != ''
        shell: pwsh
        run: |
          # #97: a fixed version with a known sha256, not the latest download.
          Invoke-WebRequest https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe -OutFile wingetcreate.exe
          $hash = (Get-FileHash wingetcreate.exe -Algorithm SHA256).Hash
          if ($hash -ne "24042BD37915805615E6CF969AC57C6439124C3FE85823327F5F3FB24BD9FFEA") { throw "wingetcreate.exe sha256 is $hash, not the pinned value." }
          ./wingetcreate.exe submit --token $env:WINGET_TOKEN --prtitle "New version: BasantPandey.CmdWarden $env:VERSION" artifacts/packages/winget
