# Tag-triggered pack + publish exes + GitHub Release (PRD #67 + exe assets).
# Push v0.1.0 → CmdWarden.0.1.0.nupkg + CmdWarden.0.1.0-win-x64.zip
name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  pack-release:
    runs-on: windows-latest
    permissions:
      contents: write
      packages: write
    # #42: signing runs when one signing way is configured. Secrets cannot go in an if, so env carries them.
    env:
      ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
      CODE_SIGNING_PFX: ${{ secrets.CODE_SIGNING_PFX }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Derive package version from tag
        id: ver
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v.+') { throw "Tag must match v*: $tag" }
          $version = $tag.Substring(1)
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Empty version after stripping v" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Package version: $version (tag $tag)"

      - name: Restore
        run: dotnet restore CmdWarden.sln

      - name: Build
        run: >
          dotnet build CmdWarden.sln
          -c Release
          --no-restore
          -p:Version=${{ env.VERSION }}
          -p:PackageVersion=${{ env.VERSION }}

      - name: Test
        run: dotnet test CmdWarden.sln -c Release --no-build --verbosity normal --filter "Category!=Process"

      - name: Pack tool (nupkg)
        # Pack rebuilds/publishes for PackAsTool so agent/ + shim-payload/ inject correctly.
        run: >
          dotnet pack src/CmdWarden.Cli/CmdWarden.Cli.csproj
          -c Release
          -o ${{ github.workspace }}/artifacts/nupkg
          -p:Version=${{ env.VERSION }}
          -p:PackageVersion=${{ env.VERSION }}

      - name: Publish Windows exes
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "artifacts/bin"
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          New-Item -ItemType Directory -Path $out | Out-Null

          # Framework-dependent publish (no RID): produces cw.exe (+ cmdwarden, agent/, shim-payload/).
          # Avoid -r win-x64: nested Agent MSBuild lacks that RID in assets. Needs .NET 10 runtime to run.
          dotnet publish src/CmdWarden.Cli/CmdWarden.Cli.csproj `
            -c Release `
            -o $out `
            -p:Version=$env:VERSION `
            -p:PackageVersion=$env:VERSION `
            -p:PublishSingleFile=false

          $required = @(
            "cw.exe",
            "cmdwarden.exe",
            "agent\CmdWarden.Agent.exe",
            "shim-payload\gh.exe",
            "shim-payload\git.exe",
            "shim-payload\az.exe",
            "shim-payload\docker.exe",
            "shim-payload\docker-credential-cmdwarden.exe"
          )
          foreach ($rel in $required) {
            $p = Join-Path $out $rel
            if (-not (Test-Path $p)) {
              Write-Host "Publish tree:"
              Get-ChildItem $out -Recurse -File | Select-Object -ExpandProperty FullName
              throw "Missing expected binary after publish: $rel"
            }
          }

      - name: Stage the files to sign
        shell: pwsh
        run: >
          ./scripts/Release-Signing.ps1 -Stage
          -Bin artifacts/bin
          -Nupkg artifacts/nupkg/CmdWarden.${{ env.VERSION }}.nupkg
          -Script scripts/Install-CmdWarden.ps1,scripts/Uninstall-CmdWarden.ps1
          -Out artifacts/to-sign

      - name: Sign with Azure Artifact Signing
        if: env.ARTIFACT_SIGNING_ENDPOINT != ''
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}/artifacts/to-sign/files
          files-folder-filter: exe,dll,ps1
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign with a code signing certificate
        if: env.ARTIFACT_SIGNING_ENDPOINT == '' && env.CODE_SIGNING_PFX != ''
        shell: pwsh
        env:
          CODE_SIGNING_PASSWORD: ${{ secrets.CODE_SIGNING_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cmdwarden-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODE_SIGNING_PFX))
          try {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName | Select-Object -Last 1 -ExpandProperty FullName
            $files = Get-ChildItem artifacts/to-sign/files -Recurse -File | Select-Object -ExpandProperty FullName
            & $signtool sign /fd SHA256 /f $pfx /p $env:CODE_SIGNING_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $files
            if ($LASTEXITCODE -ne 0) { throw "signtool failed with exit code $LASTEXITCODE" }
          }
          finally {
            Remove-Item -Force $pfx -ErrorAction SilentlyContinue
          }

      - name: Put the signed files back and check them
        shell: pwsh
        run: |
          if (-not $env:ARTIFACT_SIGNING_ENDPOINT -and -not $env:CODE_SIGNING_PFX) {
            if ("${{ vars.REQUIRE_SIGNING }}" -eq "true") { throw "REQUIRE_SIGNING is true, but no signing secret is set." }
            Write-Host "::warning::No signing secret is set. The release binaries are not signed."
            exit 0
          }
          ./scripts/Release-Signing.ps1 -Apply -Out artifacts/to-sign
          ./scripts/Release-Signing.ps1 -Verify -Out artifacts/to-sign

      - name: Push nupkg to GitHub Packages
        run: >
          dotnet nuget push ${{ github.workspace }}/artifacts/nupkg/CmdWarden.${{ env.VERSION }}.nupkg
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate

      - name: Zip Windows exes
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "artifacts/bin"
          $zip = Join-Path $env:GITHUB_WORKSPACE "artifacts/CmdWarden.$($env:VERSION)-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath $zip -Force
          Write-Host "Wrote $zip"
          Get-Item $zip | Format-List Name, Length

      - name: Build setup zip
        shell: pwsh
        run: |
          $setup = Join-Path $env:GITHUB_WORKSPACE "artifacts/setup"
          if (Test-Path $setup) { Remove-Item $setup -Recurse -Force }
          New-Item -ItemType Directory -Path $setup | Out-Null
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "artifacts/nupkg/CmdWarden.$($env:VERSION).nupkg") $setup
          foreach ($f in "install.cmd", "uninstall.cmd", "Install-CmdWarden.ps1", "Uninstall-CmdWarden.ps1") {
            Copy-Item (Join-Path $env:GITHUB_WORKSPACE "scripts/$f") $setup
          }
          $zip = Join-Path $env:GITHUB_WORKSPACE "artifacts/CmdWarden.$($env:VERSION)-setup.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $setup '*') -DestinationPath $zip -Force
          Get-Item $zip | Format-List Name, Length

      - name: Create GitHub Release and attach assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $nupkg = Join-Path $env:GITHUB_WORKSPACE "artifacts/nupkg/CmdWarden.$($env:VERSION).nupkg"
          $zip = Join-Path $env:GITHUB_WORKSPACE "artifacts/CmdWarden.$($env:VERSION)-win-x64.zip"
          $setupZip = Join-Path $env:GITHUB_WORKSPACE "artifacts/CmdWarden.$($env:VERSION)-setup.zip"
          if (-not (Test-Path $nupkg)) {
            Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE "artifacts/nupkg") -ErrorAction SilentlyContinue
            throw "Missing nupkg: $nupkg"
          }
          if (-not (Test-Path $zip)) {
            throw "Missing zip: $zip"
          }
          if (-not (Test-Path $setupZip)) {
            throw "Missing setup zip: $setupZip"
          }

          $v = $env:VERSION
          $notes = @"
          ## CmdWarden $v

          First-catalog Windows CLI secret gate (Session Agent, vault, policy, harden/shims, scan).

          ### Assets

          | Asset | Use |
          |-------|-----|
          | ``CmdWarden.$v-setup.zip`` | Easiest: extract, then double-click ``install.cmd``. No download, no GitHub login. |
          | ``CmdWarden.$v.nupkg`` | Install as a global **dotnet tool** by hand |
          | ``CmdWarden.$v-win-x64.zip`` | Unzipped binaries: ``cw.exe``, ``cmdwarden.exe``, ``agent/``, ``shim-payload/`` (needs .NET 10 runtime) |

          ### Install with the setup zip (easiest)

          1. Download ``CmdWarden.$v-setup.zip`` and extract it.
          2. Double-click ``install.cmd``. When the .NET 10 SDK is missing, the installer offers to install it with winget.
          3. To remove CmdWarden: Windows Settings > Apps > CmdWarden > Uninstall, or double-click ``uninstall.cmd``.

          ### Install as dotnet tool (by hand)

          1. Download ``CmdWarden.$v.nupkg`` from this Release into a local folder (e.g. ``C:\packages``).
             If the repository is private, sign in to GitHub in the browser first.
          2. Install:

          ``````powershell
          dotnet tool install -g CmdWarden --add-source C:\packages --version $v
          cw version
          cw doctor
          ``````

          ### Use the zip (optional)

          1. Download and extract ``CmdWarden.$v-win-x64.zip``.
          2. Run ``cw.exe`` / ``cmdwarden.exe`` from the extract folder (or add it to PATH).
          3. Session Agent is under ``agent\CmdWarden.Agent.exe``; harden payloads under ``shim-payload\``.

          ### Signature

          Every CmdWarden exe and dll carries a signature when the release was signed. Check them:

          ``````powershell
          Get-ChildItem "$env:USERPROFILE\.dotnet\tools\.store\cmdwarden" -Recurse -Include cw.dll, CmdWarden.*.exe |
            Get-AuthenticodeSignature | Format-Table Status, Path
          ``````

          ### After install

          See the repository README and user guide for ``cw agent start``, policy enroll, ``cw harden``, and ``cw scan``.
          Install is binaries only; harden is opt-in for PATH shims.

          ### Update

          ``````powershell
          cw update
          ``````

          ``cw update`` downloads ``CmdWarden.<version>-setup.zip``, checks its sha256, and runs its installer.
          To remove CmdWarden, run ``cw uninstall``.
          "@
          $notes = ($notes -split "`n" | ForEach-Object { $_ -replace '^          ', '' }) -join "`n"
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          Set-Content -Path $notesPath -Value $notes.Trim() -Encoding utf8

          gh release create $env:TAG $setupZip $nupkg $zip `
            --title "CmdWarden $v" `
            --notes-file $notesPath `
            --verify-tag
