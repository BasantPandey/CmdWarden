# Build the MkDocs site and publish it to GitHub Pages.
# Pages source must be "GitHub Actions" (Settings > Pages).
name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'CONTEXT.md'
      - '.github/workflows/docs.yml'
      - 'requirements-docs.txt'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'CONTEXT.md'
      - '.github/workflows/docs.yml'
      - 'requirements-docs.txt'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # #97: the hashes in requirements-docs.txt pin each package. Make it with: uv pip compile requirements-docs.in --generate-hashes --python-version 3.12 --universal -o requirements-docs.txt
      - run: pip install --require-hashes -r requirements-docs.txt
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
